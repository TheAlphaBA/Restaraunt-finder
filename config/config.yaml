llm:
  provider: groq                # Groq inference API (OpenAI-compatible)
  model: qwen/qwen3.6-27b      # or "openai/gpt-oss-120b"
  base_url: https://api.groq.com/openai/v1
  temperature: 0.4
  max_tokens: 1024

data:
  dataset_name: ManikaSaini/zomato-restaurant-recommendation
  max_candidates: 15            # Max restaurants to pass to LLM
  cache_dir: .cache/

budget_ranges:
  low:    [0, 300]
  medium: [300, 700]
  high:   [700, 9999]
